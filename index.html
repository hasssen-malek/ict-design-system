<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ICT — Turn technology complexity into competitive advantage</title>
<meta name="description" content="ICT partners with leading organisations in Qatar to design, secure, and scale intelligent digital ecosystems powered by cloud, AI, and cyber resilience." />

<link rel="stylesheet" href="ds/colors_and_type.css" />
<link rel="stylesheet" href="styles.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div id="root" class="page"></div>

<script type="text/babel" src="components/Nav.jsx"></script>
<script type="text/babel" src="components/Hero.jsx"></script>
<script type="text/babel" src="components/TrustedBy.jsx"></script>
<script type="text/babel" src="components/Services.jsx"></script>
<script type="text/babel" src="components/WhyICT.jsx"></script>
<script type="text/babel" src="components/SuccessStories.jsx"></script>
<script type="text/babel" src="components/CTABanner.jsx"></script>
<script type="text/babel" src="components/Footer.jsx"></script>

<script type="text/babel">
  const { useEffect } = React;

  function useScrollReveal() {
    useEffect(() => {
      const els = document.querySelectorAll(".reveal");
      const io = new IntersectionObserver(
        (entries) => {
          for (const e of entries) {
            if (e.isIntersecting) {
              e.target.classList.add("is-in");
              io.unobserve(e.target);
            }
          }
        },
        { threshold: 0.15, rootMargin: "0px 0px -60px 0px" }
      );
      els.forEach((el) => io.observe(el));
      return () => io.disconnect();
    }, []);
  }

  function App() {
    useScrollReveal();
    return (
      <>
        <Nav />
        <main>
          <Hero />
          <TrustedBy />
          <Services />
          <WhyICT />
          <SuccessStories />
          <CTABanner />
        </main>
        <Footer />
      </>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);

  // Lucide icon pass once after initial render
  requestAnimationFrame(() => {
    setTimeout(() => {
      if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 1.5 } });
    }, 80);
  });
</script>

<script src="components/smooth-scroll.js"></script>
</body>
</html>
